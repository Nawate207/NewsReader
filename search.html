<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' https://rts-pctr.c.yimg.jp https://pbs.twimg.com; script-src 'self'; style-src 'self'; connect-src https://*.logic.azure.com; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>X検索 | RSS Reader</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <script src="theme-init.js"></script>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="search.css">
</head>
<body>
  <header class="topbar">
    <h1 id="pageTitle">X検索</h1>
    <div class="actions">
      <a class="nav-button" href="index.html">RSS一覧</a>
      <button id="settingsBtn" type="button" aria-expanded="false" aria-controls="settings">設定</button>
      <button id="themeBtn" type="button">テーマ切替</button>
    </div>
  </header>
  <section id="settings" class="settings" hidden>
    <label for="endpoint">検索用 Logic Apps の HTTP URL（この端末のブラウザにのみ保存されます）</label>
    <input id="endpoint" type="password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"
           placeholder="https://prod-xx.japaneast.logic.azure.com:443/workflows/...">
    <div class="row">
      <button id="saveBtn" class="primary" type="button">保存</button>
      <button id="clearBtn" type="button">URLを削除</button>
    </div>
    <p class="hint">署名付きURLはパスワードと同様に扱ってください。</p>
  </section>
  <main class="search-page">
    <nav class="view-tabs" aria-label="表示切替">
      <button id="tabSearch" type="button" class="tab" aria-pressed="true">検索</button>
      <button id="tabBookmarks" type="button" class="tab" aria-pressed="false">★ ブックマーク <span id="bmCount" class="count">0</span></button>
    </nav>

    <section id="searchView">
      <form id="searchForm" class="search-panel" novalidate>
        <label for="p">検索キーワード</label>
        <input id="p" name="p" type="search" required>
        <details class="parameters">
          <summary>詳細パラメータ</summary>
          <div class="parameter-grid">
            <label>並べ替え
              <select name="md">
                <option value="">新着順</option>
                <option value="h">人気順</option>
              </select>
            </label>
            <label>メディアタイプ
              <select name="mtype">
                <option value="">指定なし</option>
                <option value="image">画像のみ</option>
                <option value="video">動画のみ</option>
              </select>
            </label>
            <label>取得件数
              <input name="results" type="number" inputmode="numeric" min="1" step="1">
            </label>
            <label>取得開始位置
              <input name="start" type="number" inputmode="numeric" min="1" max="10000" step="1">
              <span class="hint">1始まり、上限10000</span>
            </label>
            <label>ツイートID
              <input name="oldestTweetId" type="text" inputmode="numeric" autocomplete="off">
              <span class="hint">カーソルページネーション</span>
            </label>
            <label>この時刻以降
              <input name="since" type="datetime-local">
            </label>
            <label>この時刻以前
              <input name="until" type="datetime-local">
            </label>
          </div>
        </details>
        <button id="searchBtn" class="primary" type="submit">検索</button>
      </form>

      <details class="search-panel saved-panel">
        <summary>保存した検索条件 <span id="savedCount" class="count">0</span></summary>
        <div class="save-row">
          <input id="saveName" type="text" maxlength="40" autocomplete="off" placeholder="名前（省略時はキーワード）" aria-label="保存する検索条件の名前">
          <button id="saveSearchBtn" type="button">現在の条件を保存</button>
        </div>
        <ul id="savedList" class="saved-list"></ul>
      </details>

      <p id="status" role="status" aria-live="polite"></p>
      <ul id="posts" class="post-list"></ul>
    </section>

    <section id="bookmarkView" hidden>
      <div class="search-panel">
        <label for="bmQuery">絞り込み</label>
        <input id="bmQuery" type="search" autocomplete="off" placeholder="本文・メモ・タグ・ユーザー名">
        <div class="filter-grid">
          <label>種類
            <select id="bmType">
              <option value="">すべて</option>
              <option value="x">Xポスト</option>
              <option value="rss">RSS記事</option>
            </select>
          </label>
          <label>タグ
            <select id="bmTag"><option value="">すべて</option></select>
          </label>
          <label>並び順
            <select id="bmSort">
              <option value="saved">保存が新しい順</option>
              <option value="time">投稿が新しい順</option>
            </select>
          </label>
        </div>
        <div class="check-row">
          <label class="check"><input id="bmImage" type="checkbox"> 画像付きのみ（Xポスト）</label>
          <label class="check"><input id="bmMemo" type="checkbox"> メモありのみ</label>
        </div>
      </div>
      <div class="bm-toolbar">
        <span id="bmSummary" class="hint"></span>
        <button id="bmClearBtn" type="button">すべて削除</button>
      </div>
      <p id="bmStatus" role="status" aria-live="polite"></p>
      <ul id="bmList" class="post-list"></ul>
    </section>
  </main>
  <script src="bookmarks.js"></script>
  <script src="search.js"></script>
</body>
</html>
